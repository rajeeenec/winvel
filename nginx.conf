# Nginx Configuration for Winvel Project
# Domains:
# - Frontend: http://winveel.com (Port 3000)
# - Admin:    http://winveel.com/admin/ (Port 5174)
# - Backend:  http://api.winveel.com or http://api-winveel.com (Port 5000)

# =======================================================
# 1. FRONTEND & ADMIN (winveel.com & www.winveel.com)
# =======================================================
server {
    listen 80;
    server_name winveel.com www.winveel.com;

    client_max_body_size 20M;

    # ---------------------------------------------------
    # Admin Panel Redirect & Proxy: http://winveel.com/admin
    # ---------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://host.docker.internal:5174/admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------
    # Backend API Backup Proxy: http://winveel.com/api
    # ---------------------------------------------------
    location /api {
        proxy_pass http://host.docker.internal:5000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------
    # Main Frontend: http://winveel.com (Port 3000)
    # ---------------------------------------------------
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =======================================================
# 2. BACKEND API & FILE UPLOADS (api.winveel.com / api-winveel.com)
# =======================================================
server {
    listen 80;
    server_name api.winveel.com api-winveel.com;

    client_max_body_size 20M;

    # File uploads (Port 5001 File Service)
    location /uploads {
        proxy_pass http://host.docker.internal:5001/uploads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Express API (Port 5000 Backend Service)
    location / {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
